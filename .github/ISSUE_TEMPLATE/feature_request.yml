name: Feature request
description: Suggest a router, a metric, a task suite or a UI change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The question you want TejRouter to answer, and why it can't today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new router
        - Benchmarks and tasks
        - Statistics and the report
        - Compare / Leaderboard
        - Something else
